map $http_user_agent $is_bad_crawler {
    default 0;
    # Scanner celah keamanan & brute-force tools
    ~*(sqlmap|nikto|masscan|nmap|acunetix|dirbuster|gobuster|wpscan|hydra) 1;
    # Crawler komersial & SEO agresif
    ~*(bytespider|mj12bot|ahrefsbot|semrushbot|dotbot|petalbot|zoominfo) 1;
    # AI Scraper yang menyedot resource
    ~*(gptbot|chatgpt-user|claudebot|ccbot|anthropic-ai|cohere-ai) 1;
    # Request tanpa User-Agent
    "" 1;
}

limit_req_zone $binary_remote_addr zone=sdpdn_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=sdpdn_admin_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=sdpdn_docs_limit:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=sdpdn_conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name sdpdn-ckan-wrapper-api.muaraenimkab.go.id;

    # Log redirect
    access_log /var/log/nginx/sdpdn_wrapper_access.log;
    error_log  /var/log/nginx/sdpdn_wrapper_error.log warn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sdpdn-ckan-wrapper-api.muaraenimkab.go.id;

    # --- SSL CONFIGURATION (Mengadopsi sertifikat server mekab) ---
    ssl_certificate     /etc/ssl/certs/mekab-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/mekab.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # --- LOGGING SISTEM (Standar server satudata) ---
    access_log /var/log/nginx/sdpdn_wrapper_access.log;
    error_log  /var/log/nginx/sdpdn_wrapper_error.log warn;

    # --- SECURITY HEADERS ---
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    limit_conn sdpdn_conn_limit 15;
    limit_req_status 429;
    limit_conn_status 429;

    if ($is_bad_crawler) {
        return 403;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~* (\.env|\.git|\.docker|\.bak|\.php|wp-admin|composer\.json|package\.json) {
        return 404;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|docs\.json) {
        limit_req zone=sdpdn_docs_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/admin/ {
        limit_req zone=sdpdn_admin_limit burst=3 nodelay;

        limit_except GET POST PUT DELETE OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
    }

    location /api/v1/ {
        limit_except GET OPTIONS {
            deny all;
        }

        limit_req zone=sdpdn_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Sinkron dengan CKAN_TIMEOUT_MS (15 detik)
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_redirect off;
    }

    location / {
        limit_req zone=sdpdn_api_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
    }
}
