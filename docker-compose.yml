services:
  sdpdn-wrapper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdpdn-ckan-api-wrapper
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
